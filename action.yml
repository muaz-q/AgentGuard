name: AgentGuard
description: Find LLM cost risks in Python agent code - unbounded loops, quadratic history growth, uncapped outputs.
author: Muaz
branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Files or directories to scan, space-separated.
    default: "."
  fail-on:
    description: Fail the step if any finding is at least this severe (high, medium, low, never).
    default: high
  model:
    description: Model to price calls at when the code does not name one.
    default: ""
  args:
    description: 'Extra arguments for the agentguard CLI, e.g. "--ignore AG006 --exclude tests".'
    default: ""
  upload-sarif:
    description: "Upload findings to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  summary:
    description: Write the report to the job summary.
    default: "true"
  python-version:
    description: Python used to run AgentGuard.
    default: "3.12"

outputs:
  findings:
    description: Number of findings.
    value: ${{ steps.run.outputs.findings }}
  high:
    description: Number of high-severity findings.
    value: ${{ steps.run.outputs.high }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AgentGuard
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Run AgentGuard
      id: run
      shell: bash
      env:
        AG_PATHS: ${{ inputs.path }}
        AG_MODEL: ${{ inputs.model }}
        AG_ARGS: ${{ inputs.args }}
        AG_FAIL_ON: ${{ inputs.fail-on }}
        AG_SUMMARY: ${{ inputs.summary }}
      run: |
        set -u
        out="$RUNNER_TEMP/agentguard"
        mkdir -p "$out"
        model_args=()
        [ -n "$AG_MODEL" ] && model_args=(--model "$AG_MODEL")
        # shellcheck disable=SC2086
        agentguard $AG_PATHS "${model_args[@]}" $AG_ARGS --fail-on never -f sarif -o "$out/agentguard.sarif"
        # shellcheck disable=SC2086
        agentguard $AG_PATHS "${model_args[@]}" $AG_ARGS --fail-on never -f json -o "$out/agentguard.json"
        if [ "$AG_SUMMARY" = "true" ]; then
          # shellcheck disable=SC2086
          agentguard $AG_PATHS "${model_args[@]}" $AG_ARGS --fail-on never -f markdown >> "$GITHUB_STEP_SUMMARY"
        fi
        python - "$out/agentguard.json" <<'PY' >> "$GITHUB_OUTPUT"
        import json, sys
        s = json.load(open(sys.argv[1]))["summary"]
        print(f"findings={s['findings']}")
        print(f"high={s['by_severity']['high']}")
        PY
        echo "sarif=$out/agentguard.sarif" >> "$GITHUB_OUTPUT"
        # The real exit status, decided last so the reports above are always produced.
        set +e
        # shellcheck disable=SC2086
        agentguard $AG_PATHS "${model_args[@]}" $AG_ARGS --no-costs --fail-on "$AG_FAIL_ON" > /dev/null
        echo "status=$?" >> "$GITHUB_OUTPUT"

    - name: Upload to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
        category: agentguard

    - name: Apply fail-on
      shell: bash
      run: |
        status="${{ steps.run.outputs.status }}"
        if [ "$status" = "1" ]; then
          echo "::error::AgentGuard found issues at or above '${{ inputs.fail-on }}' severity (see the job summary)"
          exit 1
        fi
        exit "${status:-0}"
