repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: agentguard
        name: agentguard (dogfood)
        entry: agentguard --no-costs agentguard
        language: system
        types: [python]
        pass_filenames: false
