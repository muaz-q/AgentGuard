[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-cli"
version = "0.3.0"
description = "Find LLM cost risks in Python agent code - unbounded loops, quadratic history growth - and estimate what a run costs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muaz" }]
keywords = ["llm", "agents", "cost", "static-analysis", "linter", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3; python_version >= '3.10'"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=1.0; python_version >= '3.10'",
    "mcp>=2.3,<3; python_version >= '3.10'",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://agent-guard-six.vercel.app"
Source = "https://github.com/muaz-q/agentguard"
Issues = "https://github.com/muaz-q/agentguard/issues"

[project.scripts]
agentguard = "agentguard.cli:entry"
agentguard-mcp = "agentguard.mcp_server:main"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
agentguard = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agentguard"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["tests/fixtures", "bench/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP006", "UP007", "UP035", "UP045", "SIM108", "E741"]

[tool.mypy]
python_version = "3.10"
files = ["agentguard"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.agentguard]
# The demo agent is broken on purpose; `agentguard examples/research_agent.py` still scans it.
exclude = ["tests/fixtures/*", "bench/*", "examples/research_agent.py"]
